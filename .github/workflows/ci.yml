name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    # 刻意不注入任何環境變數:測試設定由 core/settings_test.py 提供
    # (pytest.ini 指定為 DJANGO_SETTINGS_MODULE),該模組強制覆寫所有
    # Azure 值為佔位字串。CI 因此不需要、也不應該持有任何真實金鑰。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check .

      - name: Check import order (isort)
        run: isort --check-only .

      - name: Lint (flake8)
        run: flake8 .

      - name: Type check (mypy)
        run: mypy . || true  # 規格中 mypy 為「靜態分析」,允許 warning-only 直到完整型別覆蓋

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
