# 後端持續部署 — build image → GitHub Container Registry → App Service
#
# 認證使用 Azure OIDC federated credential：GitHub 為每次 workflow run 簽發
# 短效期 token 換取 Azure access token，儲存庫內因此不存在任何長期有效的
# service principal 密碼。設定步驟見 docs/DEPLOYMENT.md。
#
# 映像推到 ghcr.io 而非 Azure Container Registry：ACR 連 Basic 層都是每月
# 約 $5 的固定費用（與推送次數無關），對一個 demo 專案而言那是整份帳單的
# 大頭；ghcr.io 的公開映像則不計費。推送用的是 workflow 自動簽發的
# GITHUB_TOKEN，因此同樣不需要在儲存庫存放 registry 帳密。
#
# App Service 以「匿名」方式拉取，所以 ghcr 上的套件必須設為 Public——
# 首次推送後需手動改一次可見性，見 docs/DEPLOYMENT.md 步驟 4。
#
# 需要的 repository variables:  AZURE_RESOURCE_GROUP, WEBAPP_NAME
# 需要的 repository secrets:    AZURE_CLIENT_ID, AZURE_TENANT_ID,
#                              AZURE_SUBSCRIPTION_ID

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC token 簽發
  contents: read
  packages: write # 推送映像至 ghcr.io

# 同時只允許一次部署，且不取消進行中的部署——
# 中途取消 az webapp 設定變更可能留下處於半套狀態的容器設定。
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: azure-rag-assistant

jobs:
  deploy:
    name: Build and deploy to App Service
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to container registry
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "${REGISTRY}" \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          set -euo pipefail
          # ghcr 的映像路徑一律小寫，GitHub 帳號名稱卻允許大寫字母。
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${OWNER}/${IMAGE_NAME}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          # 同時標記 commit SHA 與 latest：SHA 標籤讓每次部署可精確追溯與回滾，
          # latest 供手動 az webapp create / 本地拉取使用。
          docker build \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            ./backend
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Point App Service at the new image
        run: |
          set -euo pipefail
          # 公開映像的拉取不帶任何憑證，因此必須關掉 Managed Identity 拉取——
          # 留著 true 時 App Service 會拿 Azure AD token 去跟 ghcr 認證並失敗。
          # 這裡重設而非只靠 provision.sh：這個旗標決定「本步驟剛推的映像拉不
          # 拉得動」，讓它跟映像位址一起被每次部署收斂，設定漂掉也自己修回來。
          az resource update \
            --ids "$(az webapp show \
                      --name "${{ vars.WEBAPP_NAME }}" \
                      --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                      --query id --output tsv)/config/web" \
            --set properties.acrUseManagedIdentityCreds=false \
            --output none

          # 必須一併指定 registry url：App Service 不會從映像名稱推斷 registry，
          # 沿用上一次的設定（ACR）會讓拉取指向錯誤的主機。
          # 公開映像不需帳密，故不傳 --container-registry-user/password。
          az webapp config container set \
            --name "${{ vars.WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --container-image-name "${IMAGE}:${GITHUB_SHA}" \
            --container-registry-url "https://${REGISTRY}"

      - name: Restart to pull the new image
        run: |
          az webapp restart \
            --name "${{ vars.WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"

      # 部署後驗證：容器要真的起得來才算部署成功。缺少這步時，映像推送成功
      # 但應用程式啟動失敗的部署會被誤判為綠燈。
      - name: Wait for health check
        run: |
          set -uo pipefail
          URL="https://${{ vars.WEBAPP_NAME }}.azurewebsites.net/api/health/"
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            if [ "$code" = "200" ]; then
              echo "健康檢查通過 (嘗試 ${attempt} 次)"
              exit 0
            fi
            echo "嘗試 ${attempt}/30 — HTTP ${code}，10 秒後重試"
            sleep 10
          done
          echo "::error::健康檢查在 5 分鐘內未通過，部署視為失敗"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          az webapp log tail \
            --name "${{ vars.WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --provider docker &
          sleep 30
          kill %1 || true
