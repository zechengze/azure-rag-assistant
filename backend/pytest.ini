[pytest]
# core.settings_test 在匯入 core.settings 前先注入測試環境變數。
# 不可改回 core.settings:那會讓測試讀到開發者 .env 中的真實金鑰與資料庫。
DJANGO_SETTINGS_MODULE = core.settings_test
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers --tb=short -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: marks tests requiring real Azure services (deselect with '-m "not integration"')
